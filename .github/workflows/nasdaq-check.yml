name: 나스닥 공황 감시

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  check-nasdaq:
    runs-on: ubuntu-latest
    steps:
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 패키지 설치
        run: npm install firebase-admin node-fetch@2

      - name: 나스닥 공황 체크 및 알림 발송
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cat << 'SCRIPT' > run.js
          const fetch = require('node-fetch');
          const admin = require('firebase-admin');

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });

          async function getStock(symbol) {
            try {
              const url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + symbol + '?interval=1d&range=3mo';
              const res = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0' } });
              const json = await res.json();
              const result = json.chart.result[0];
              const closes = result.indicators.quote[0].close.filter(v => v !== null);
              const price = closes[closes.length - 1];
              const prevPrice = closes[closes.length - 2];
              const change = ((price - prevPrice) / prevPrice * 100).toFixed(2);
              const ma60 = (closes.slice(-60).reduce((a,b) => a+b, 0) / Math.min(closes.length, 60)).toFixed(2);
              return { price: price.toFixed(2), change, ma60, closes };
            } catch(e) {
              console.log('오류:', symbol, e.message);
              return null;
            }
          }

          async function main()
