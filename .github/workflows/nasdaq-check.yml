name: 나스닥 공황 감시

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  check-nasdaq:
    runs-on: ubuntu-latest
    steps:
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: firebase-admin 설치
        run: npm install firebase-admin

      - name: 나스닥 공황 체크 및 알림 발송
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e "
          const https = require('https');
          const admin = require('firebase-admin');

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });

          function getStock(symbol) {
            return new Promise((resolve) => {
              const options = {
                hostname: 'query1.finance.yahoo.com',
                path: '/v8/finance/chart/' + symbol + '?interval=1d&range=3mo',
                headers: { 'User-Agent': 'Mozilla/5.0' }
              };
              https.get(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    const json = JSON.parse(data);
                    const result = json.chart.result[0];
                    const closes = result.indicators.quote[0].close;
                    const price = closes[closes.length - 1];
                    const prevPrice = closes[closes.length - 2];
                    const change = ((price - prevPrice) / prevPrice * 100).toFixed(2);
                    const ma60 = closes.slice(-60).reduce((a,b) => a+b, 0) / Math.min(closes.length, 60);
                    resolve({ price: price.toFixed(2), change, ma60: ma60.toFixed(2), closes });
                  } catch(e) { resolve(null); }
                });
              }).on('error', () => resolve(null));
            });
          }

          async function main() {
            const nasdaq = await getStock('%5EIXIC');
            const nvda = await getStock('NVDA');
            const aapl = await getStock('AAPL');

            // 공황 카운트
            let panicCount = 0;
            if (nasdaq) {
              const closes = nasdaq.closes;
              for (let i = 1; i < closes.length; i++) {
                const change = ((closes[i] - closes[i-1]) / closes[i-1]) * 100;
                if (change <= -3) panicCount++;
              }
            }

            // 60일선 신호
            let nvdaSignal = '';
            if (nvda) {
              nvdaSignal = parseFloat(nvda.price) > parseFloat(nvda.ma60)
                ? '매수 신호 (60일선 위)'
                : '매수 중단 (60일선 아래)';
            }

            // 재진입 신호
            let reentrySignal = panicCount === 0 ? '재진입 가능' : '대기 중';

            // 알림 메시지 작성
            const title = panicCount >= 4 ? '🚨 공황 신호 감지!' : '✅ 오늘 시장 현황';
            const body = [
              '📊 나스닥: ' + (nasdaq ? nasdaq.change + '%' : '정보없음'),
              '🏆 시총1위(NVDA): $' + (nvda ? nvda.price + ' (' + nvda.change + '%)' : '정보없음'),
              '🥈 시총2위(AAPL): $' + (aapl ? aapl.price + ' (' + aapl.change + '%)' : '정보없음'),
              '📈 NVDA 60일선: ' + nvdaSignal,
              '⚠️ 이달 공황 횟수: ' + panicCount + '회',
              '🔄 재진입 신호: ' + reentrySignal
            ].join('\n');

            const message = {
              notification: { title, body },
              topic: 'jordan_panic'
            };

            await admin.messaging().send(message);
            console.log('알림 발송 완료!');
          }

          main();
          "
