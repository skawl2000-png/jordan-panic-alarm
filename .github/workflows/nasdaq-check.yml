name: 나스닥 공황 감시

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 한국시간 자정 (UTC 15시)
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  check-nasdaq:
    runs-on: ubuntu-latest
    steps:
      - name: Node.js 설정
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 나스닥 공황 체크 및 알림 발송
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e "
          const https = require('https');

          function getNasdaq() {
            return new Promise((resolve) => {
              const options = {
                hostname: 'query1.finance.yahoo.com',
                path: '/v8/finance/chart/%5EIXIC?interval=1d&range=1mo',
                headers: { 'User-Agent': 'Mozilla/5.0' }
              };
              https.get(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    const json = JSON.parse(data);
                    const closes = json.chart.result[0].indicators.quote[0].close;
                    let count = 0;
                    for (let i = 1; i < closes.length; i++) {
                      const change = ((closes[i] - closes[i-1]) / closes[i-1]) * 100;
                      if (change <= -3) count++;
                    }
                    console.log('이번달 -3% 이상 횟수:', count);
                    resolve(count);
                  } catch(e) { resolve(0); }
                });
              }).on('error', () => resolve(0));
            });
          }

          getNasdaq().then(count => {
            if (count >= 4) {
              console.log('🚨 공황 신호! FCM 알림 발송 필요:', count + '회');
              process.exit(0);
            } else {
              console.log('✅ 정상. 현재 ' + count + '회');
            }
          });
          "